<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=directions/index.html">
  <script>
    const target = new URL('directions/index.html', window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</head>
<body>
  <a href="directions/index.html">Continue</a>
</body>
</html>
