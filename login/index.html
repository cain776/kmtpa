<body class="is-join is-member" data-i18n-page="login">

  <div id="header-mount"></div>

  <main class="login-wrap">
    <div class="login-card">

      <span data-i18n="login.span.1" class="eyebrow">Member · 회원</span>
      <h1 data-i18n="login.h1.1">회원 로그인</h1>
      <p data-i18n="login.p.1" class="lede">가입하신 이메일로 로그인하시면 내 정보와 문의 답변을 확인하실 수 있습니다.</p>

      <p class="form-success" data-login-notice role="status" hidden></p>

      <form class="login-form" data-login-form novalidate>

        <!-- 실패 요약. 화면을 못 보는 분께는 이쪽이 유일한 신호라 role=alert 을 답니다.
             항목별 문구도 따로 남겨 어느 칸이 틀렸는지 알 수 있게 합니다. -->
        <p class="form-error" data-login-error role="alert" tabindex="-1" hidden></p>

        <label data-i18n="login.label.1" class="field">
          <span>이메일</span>
          <input id="login-email" name="email" type="email" autocomplete="email"
                 placeholder="name@email.com" aria-describedby="login-email-error" required>
          <span class="field-error" id="login-email-error" data-error-for="login-email" hidden></span>
        </label>

        <label data-i18n="login.label.2" class="field">
          <span>비밀번호</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password"
                 aria-describedby="login-password-error" required>
          <span class="field-error" id="login-password-error" data-error-for="login-password" hidden></span>
        </label>

        <div class="login-actions">
          <button data-i18n="login.button.1" type="submit" class="btn-solid" data-login-submit>로그인</button>
        </div>
      </form>

      <div data-i18n="login.div.1" class="login-links">
        <a href="../join/index.html">회원가입</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:info@kmtpa.org?subject=%EB%B9%84%EB%B0%80%EB%B2%88%ED%98%B8%20%EC%B0%BE%EA%B8%B0">비밀번호를 잊으셨나요?</a>
        <span aria-hidden="true">·</span>
        <a href="../consultation/index.html">상담 신청</a>
      </div>

    </div>
  </main>

  <div id="footer-mount"></div>
