<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 — 한국의료관광진흥협회 KMTPA</title>
  <meta name="description" content="한국의료관광진흥협회 회원 마이페이지. 내 정보와 문의 답변을 확인합니다.">
  <meta name="theme-color" content="#020028">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../images_homepage/logo2.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/base.css?v=3591fec1">
  <link rel="stylesheet" href="../css/layout.css?v=9a99d0a6">
  <link rel="stylesheet" href="../css/components.css?v=5e914f58">
  <link rel="stylesheet" href="../css/communications.css?v=a3dca2c2">
  <link rel="stylesheet" href="../css/about.css?v=65b91c16">
  <link rel="stylesheet" href="../css/page-hero.css?v=7dde8329">
  <link rel="stylesheet" href="../css/patient-journey.css?v=d88a584f">
  <link rel="stylesheet" href="../css/directions.css?v=a741e809">
  <link rel="stylesheet" href="../css/legal.css?v=9b1df0da">
  <link rel="stylesheet" href="../css/newsletter-detail.css?v=31525e4e">
  <link rel="stylesheet" href="../css/join.css?v=9b2875be">
  <link rel="stylesheet" href="../css/member.css?v=aec510a9">
</head>
<body class="is-join is-member">

  <div id="header-mount"></div>

  <section class="journey-hero">
    <div class="container-narrow">
      <!-- 로그아웃은 헤더 버튼이 담당합니다. 로그인 상태면 헤더의 '로그인'이
           '로그아웃'으로 바뀝니다(components.js). 여기 따로 두면 같은 동작이
           화면 양끝에 흩어집니다. -->
      <div class="mypage-head">
        <div>
          <span class="eyebrow">My Page · 마이페이지</span>
          <h1>내 정보와 문의 답변</h1>
          <p class="who" data-my-greeting></p>
        </div>
      </div>
    </div>
  </section>

  <section class="join-panel">
    <div class="container-narrow">
      <div class="mypage-grid">

        <!-- 왼쪽: 메뉴. 해시(#info/#inquiries)로 오른쪽 패널을 전환합니다. -->
        <nav class="my-nav" aria-label="마이페이지 메뉴">
          <a href="#info" data-my-nav="info" aria-current="page">내 정보</a>
          <a href="#inquiries" data-my-nav="inquiries">문의 <span class="count" data-my-count>0</span></a>
        </nav>

        <!-- 오른쪽: 선택한 패널 하나만 보입니다 -->
        <div class="my-panels">

          <div class="panel" data-my-panel="info">
            <h2>내 정보</h2>
            <dl class="info-dl" data-my-info></dl>
            <div class="panel-foot">
              정보를 고치시려면 <a href="mailto:info@kmtpa.org?subject=%ED%9A%8C%EC%9B%90%20%EC%A0%95%EB%B3%B4%20%EB%B3%80%EA%B2%BD">사무국</a>으로
              알려주세요. 가입 신청 내용은 제출하신 기록이라 화면에서 바로 고치지 않습니다.
            </div>
          </div>

          <div class="panel" data-my-panel="inquiries" hidden>
            <div class="my-panel-head">
              <h2>문의 <span class="count" data-my-count>0</span></h2>
              <button type="button" class="btn-solid my-inquiry-open"
                      data-my-inquiry-open aria-expanded="false">문의하기</button>
            </div>

            <form class="my-inquiry-form" data-my-inquiry-form hidden novalidate>
              <div class="field-grid">
                <label class="field">
                  <span>문의 유형 <span class="req">*</span></span>
                  <select name="inquiryType" required>
                    <option value="membership">회원가입</option>
                    <option value="partnership">기관 협력</option>
                    <option value="education_event">교육·행사</option>
                    <option value="publicity">홍보·미디어</option>
                    <option value="other">기타</option>
                  </select>
                </label>
                <label class="field">
                  <span>제목 <span class="req">*</span></span>
                  <input type="text" name="subject" maxlength="200" required>
                </label>
              </div>
              <label class="field">
                <span>문의 내용 <span class="req">*</span></span>
                <textarea name="message" rows="6" maxlength="5000" required
                          placeholder="상담하거나 문의할 내용을 구체적으로 적어 주세요."></textarea>
              </label>
              <label class="term my-inquiry-consent">
                <input type="checkbox" name="privacyConsent" required>
                <span class="term-box" aria-hidden="true"></span>
                <span class="term-label">(필수) 문의 답변을 위한 개인정보 수집·이용에 동의합니다.</span>
              </label>
              <p class="form-error" data-my-inquiry-error role="alert" hidden></p>
              <div class="my-inquiry-actions">
                <button type="button" class="btn-ghost" data-my-inquiry-close>취소</button>
                <button type="submit" class="btn-solid">문의 등록</button>
              </div>
            </form>

            <div data-my-inquiries></div>
          </div>

        </div>

      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="../js/templates.js?v=e3672f91"></script>
  <script src="../js/components.js?v=e8492bda"></script>
  <script src="../js/app.js?v=c23b9178"></script>
  <script src="../js/member.js?v=847063fe"></script>
</body>
</html>
