<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 — 한국의료관광진흥협회 KMTPA</title>
  <meta name="description" content="한국의료관광진흥협회 회원 마이페이지. 내 정보와 문의 답변을 확인합니다.">
  <meta name="theme-color" content="#020028">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../images_homepage/logo2.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/base.css?v=e16d7365">
  <link rel="stylesheet" href="../css/layout.css?v=c925d03b">
  <link rel="stylesheet" href="../css/components.css?v=8b39fb26">
  <link rel="stylesheet" href="../css/newsletter-modal.css?v=61211e90">
  <link rel="stylesheet" href="../css/communications.css?v=2eea800e">
  <link rel="stylesheet" href="../css/about.css?v=67f9c96b">
  <link rel="stylesheet" href="../css/transparency.css?v=8f7aea14">
  <link rel="stylesheet" href="../css/programs.css?v=2cf5aada">
  <link rel="stylesheet" href="../css/page-hero.css?v=ebe3648e">
  <link rel="stylesheet" href="../css/patient-journey.css?v=01e13590">
  <link rel="stylesheet" href="../css/directions.css?v=ca59bfd2">
  <link rel="stylesheet" href="../css/legal.css?v=6683f450">
  <link rel="stylesheet" href="../css/newsletter-detail.css?v=a5322878">
  <link rel="stylesheet" href="../css/join.css?v=3a6b829a">
  <link rel="stylesheet" href="../css/member.css?v=22d527d9">
</head>
<body class="is-join is-member" data-i18n-page="mypage">

  <div id="header-mount"></div>

  <section class="journey-hero">
    <div class="container-narrow">
      <!-- 로그아웃은 헤더 버튼이 담당합니다. 로그인 상태면 헤더의 '로그인'이
           '로그아웃'으로 바뀝니다(components.js). 여기 따로 두면 같은 동작이
           화면 양끝에 흩어집니다. -->
      <div class="mypage-head">
        <div>
          <span data-i18n="mypage.span.1" class="eyebrow">My Page · 마이페이지</span>
          <h1 data-i18n="mypage.h1.1">내 정보와 문의 답변</h1>
          <p class="who" data-my-greeting></p>
        </div>
      </div>
    </div>
  </section>

  <section class="join-panel">
    <div class="container-narrow">
      <div class="mypage-grid">

        <!-- 왼쪽: 메뉴. 해시(#info/#inquiries)로 오른쪽 패널을 전환합니다. -->
        <nav data-i18n="mypage.nav.1" class="my-nav" aria-label="마이페이지 메뉴">
          <a href="#info" data-my-nav="info" aria-current="page">내 정보</a>
          <a href="#inquiries" data-my-nav="inquiries">문의 <span class="count" data-my-count>0</span></a>
        </nav>

        <!-- 오른쪽: 선택한 패널 하나만 보입니다 -->
        <div class="my-panels">

          <div class="panel" data-my-panel="info">
            <h2 data-i18n="mypage.h2.1">내 정보</h2>
            <dl class="info-dl" data-my-info></dl>
            <div data-i18n="mypage.div.1" class="panel-foot">
              정보를 고치시려면 <a href="mailto:info@kmtpa.org?subject=%ED%9A%8C%EC%9B%90%20%EC%A0%95%EB%B3%B4%20%EB%B3%80%EA%B2%BD">사무국</a>으로
              알려주세요. 가입 신청 내용은 제출하신 기록이라 화면에서 바로 고치지 않습니다.
            </div>

            <section class="password-card" aria-labelledby="password-title">
              <div class="password-intro">
                <div>
                  <h3 data-i18n="mypage.password.title" id="password-title">비밀번호 변경</h3>
                  <p data-i18n="mypage.password.description">현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다. 변경하면 모든 기기에서 로그아웃됩니다.</p>
                </div>
                <button data-i18n="mypage.password.open" type="button" class="btn-password" data-password-open
                        aria-controls="password-form" aria-expanded="false">비밀번호 변경</button>
              </div>

              <form class="password-form" id="password-form" data-password-form hidden novalidate>
                <label class="field">
                  <span data-i18n="mypage.password.current">현재 비밀번호 <span class="req">*</span></span>
                  <input type="password" name="currentPassword" autocomplete="current-password" maxlength="72" required>
                </label>
                <div class="password-new-grid">
                  <label class="field">
                    <span data-i18n="mypage.password.new">새 비밀번호 <span class="req">*</span></span>
                    <input type="password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" required>
                  </label>
                  <label class="field">
                    <span data-i18n="mypage.password.confirm">새 비밀번호 확인 <span class="req">*</span></span>
                    <input type="password" name="newPasswordConfirm" autocomplete="new-password" minlength="8" maxlength="72" required>
                  </label>
                </div>
                <p class="password-help" data-i18n="mypage.password.help">영문과 숫자를 포함해 8자 이상 입력해 주세요.</p>
                <p class="form-error" data-password-error role="alert" tabindex="-1" hidden></p>
                <div class="password-actions">
                  <button data-i18n="mypage.password.cancel" type="button" class="btn-ghost" data-password-cancel>취소</button>
                  <button data-i18n="mypage.password.submit" type="submit" class="btn-password-solid">변경하기</button>
                </div>
              </form>
            </section>

            <section class="withdraw-card" aria-labelledby="withdraw-title">
              <div class="withdraw-intro">
                <div>
                  <h3 data-i18n="mypage.h3.1" id="withdraw-title">회원 탈퇴</h3>
                  <p data-i18n="mypage.p.1">탈퇴 즉시 로그아웃되며 회원 기능을 이용할 수 없습니다. 등록 정보는 개인정보처리방침에 따라 최대 1년간 제한적으로 보관된 뒤 파기됩니다.</p>
                </div>
                <button data-i18n="mypage.button.1" type="button" class="btn-withdraw" data-withdraw-open aria-controls="withdraw-form"
                        aria-expanded="false">회원 탈퇴</button>
              </div>

              <form class="withdraw-form" id="withdraw-form" data-withdraw-form hidden novalidate>
                <label data-i18n="mypage.label.1" class="field">
                  <span>본인 확인 비밀번호 <span class="req">*</span></span>
                  <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <label data-i18n="mypage.label.2" class="term withdraw-consent">
                  <input type="checkbox" name="confirmation" required>
                  <span class="term-box" aria-hidden="true"></span>
                  <span class="term-label">탈퇴 후 회원 기능을 이용할 수 없음을 확인했습니다.</span>
                </label>
                <p class="form-error" data-withdraw-error role="alert" tabindex="-1" hidden></p>
                <div class="withdraw-actions">
                  <button data-i18n="mypage.button.2" type="button" class="btn-ghost" data-withdraw-cancel>취소</button>
                  <button data-i18n="mypage.button.3" type="submit" class="btn-withdraw-solid">탈퇴 확정</button>
                </div>
              </form>
            </section>
          </div>

          <div class="panel" data-my-panel="inquiries" hidden>
            <div class="my-panel-head">
              <h2 data-i18n="mypage.h2.2">문의 <span class="count" data-my-count>0</span></h2>
              <button data-i18n="mypage.button.4" type="button" class="btn-solid my-inquiry-open"
                      data-my-inquiry-open aria-expanded="false">문의하기</button>
            </div>

            <form class="my-inquiry-form" data-my-inquiry-form hidden novalidate>
              <div class="field-grid">
                <label class="field">
                  <span data-i18n="mypage.span.2">문의 유형 <span class="req">*</span></span>
                  <select name="inquiryType" required>
                    <option data-i18n="mypage.option.1" value="membership">회원가입</option>
                    <option data-i18n="mypage.option.2" value="partnership">기관 협력</option>
                    <option data-i18n="mypage.option.3" value="education_event">교육·행사</option>
                    <option data-i18n="mypage.option.4" value="publicity">홍보·미디어</option>
                    <option data-i18n="mypage.option.5" value="other">기타</option>
                  </select>
                </label>
                <label data-i18n="mypage.label.3" class="field">
                  <span>제목 <span class="req">*</span></span>
                  <input type="text" name="subject" maxlength="200" required>
                </label>
              </div>
              <label data-i18n="mypage.label.4" class="field">
                <span>문의 내용 <span class="req">*</span></span>
                <textarea name="message" rows="6" maxlength="5000" required
                          placeholder="상담하거나 문의할 내용을 구체적으로 적어 주세요."></textarea>
              </label>
              <label data-i18n="mypage.label.5" class="term my-inquiry-consent">
                <input type="checkbox" name="privacyConsent" required>
                <span class="term-box" aria-hidden="true"></span>
                <span class="term-label">(필수) 문의 답변을 위한 개인정보 수집·이용에 동의합니다.</span>
              </label>
              <p class="form-error" data-my-inquiry-error role="alert" hidden></p>
              <div class="my-inquiry-actions">
                <button data-i18n="mypage.button.5" type="button" class="btn-ghost" data-my-inquiry-close>취소</button>
                <button data-i18n="mypage.button.6" type="submit" class="btn-solid">문의 등록</button>
              </div>
            </form>

            <div data-my-inquiries></div>
          </div>

        </div>

      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="../js/runtime-config.js?v=26206d20"></script>
  <script src="../js/templates.js?v=4370a4ce"></script>
  <script src="../js/components.js?v=6f003932"></script>
  <script src="../js/nav-dropdown.js?v=66d1ced0"></script>
  <script src="../js/app.js?v=00b88128"></script>
  <script src="../js/i18n.js?v=b3b99b26"></script>
  <script src="../js/member.js?v=4ebc0b37"></script>
</body>
</html>
