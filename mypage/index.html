  <meta name="theme-color" content="#020028">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../images_homepage/logo2.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<body class="is-join is-member">

  <div id="header-mount"></div>

  <section class="journey-hero">
    <div class="container-narrow">
      <p class="preview-note">
        <b>화면 미리보기입니다.</b> 회원 인증이 아직 서버에 없어 아래 내용은 예시입니다.
        실제 회원 정보와 문의 답변은 인증이 붙은 뒤에 표시됩니다.
      </p>

      <div class="mypage-head">
        <div>
          <span class="eyebrow">My Page · 마이페이지</span>
          <h1>내 정보와 문의 답변</h1>
          <p class="who" data-my-greeting></p>
        </div>
        <a class="btn-ghost-link" href="../login/index.html" data-logout>로그아웃</a>
      </div>
    </div>
  </section>

  <section class="join-panel">
    <div class="container-narrow">
      <div class="mypage-grid">

        <!-- 왼쪽: 내 정보 -->
        <div class="panel">
          <h2>내 정보</h2>
          <dl class="info-dl" data-my-info></dl>
          <div class="panel-foot">
            정보를 고치시려면 <a href="mailto:info@kmtpa.org?subject=%ED%9A%8C%EC%9B%90%20%EC%A0%95%EB%B3%B4%20%EB%B3%80%EA%B2%BD">사무국</a>으로
            알려주세요. 가입 신청 내용은 제출하신 기록이라 화면에서 바로 고치지 않습니다.
          </div>
        </div>

        <!-- 오른쪽: 문의와 답변 -->
        <div class="panel">
          <h2>문의 <span class="count" data-my-count>0</span></h2>
          <div data-my-inquiries></div>
        </div>

      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="../js/templates.js?v=17620814"></script>
  <script src="../js/components.js?v=a3fc2b71"></script>
